[project]
name = "mrkt-resale-bot"
version = "1.0.0"
description = "Telegram bot for automated NFT gift resale on MRKT marketplace"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10,<4",
    "aiohttp>=3.9,<4",
    "asyncpg>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
